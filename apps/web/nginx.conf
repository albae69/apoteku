# nginx untuk web Apoteku:
#  - menyajikan SPA hasil `vite build`,
#  - mem-proxy /api ke service `api` supaya browser memakai satu origin
#    (tidak ada CORS, dan URL API tidak perlu di-bake saat build).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Aset ber-hash dari Vite → aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API: teruskan apa adanya (/api/... tetap /api/...).
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:4000/health;
    }

    # SPA fallback: semua rute klien dilayani index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
